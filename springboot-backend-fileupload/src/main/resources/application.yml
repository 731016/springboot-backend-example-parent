# 公共配置文件
# @author 
# @from
spring:
  application:
    name: springboot-backend-fileupload
  # 默认 dev 环境
  profiles:
    active: @spring.profiles.active@
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cache:
    # 一般来说是不用配置的，Spring Cache 会根据依赖的包自行装配
    type: redis
  # 文件上传
  servlet:
    multipart:
      enabled: true
      location: D:/upload/tmp
      file-size-threshold: 5MB
      max-file-size: 20MB
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xiaofei.springbootbackendfileupload.controller
